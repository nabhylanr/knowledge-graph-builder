services:
  neo4j:
    image: neo4j:5.26-community        # 5.26 = LTS; native vector index, no plugin needed
    container_name: kg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"                    # Neo4j Browser (HTTP UI)
      - "7687:7687"                    # Bolt (drivers / app connect here)
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"

      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    volumes:
      - neo4j_data:/data               # graph data lives here — survives restarts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data: