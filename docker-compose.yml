name: lab-brain-kg                     # nama project/stack compose

services:
  neo4j:
    image: neo4j:5.26-community        # 5.26 = LTS; native vector index, no plugin needed
    container_name: lab-brain-neo4j
    restart: unless-stopped
    mem_limit: 2g                      # pagar keras: container kena OOM-kill duluan,
    memswap_limit: 2g                  # bukan VM-nya yang tumbang & bikin daemon mati
    ports:
      # loopback-only defaults — aman & portable buat semua orang.
      # akses dari luar (Tailscale) ditambahin lewat docker-compose.override.yml
      - "127.0.0.1:7474:7474"          # Neo4j Browser (HTTP UI)
      - "127.0.0.1:7687:7687"          # Bolt (drivers / app connect here)
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"

      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"

      # Ukuran konservatif — cukup buat graph skala kita (satu dokumen ≈ 500
      # node / 4 MB data). Naikkan kalau host-nya lapang.
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"

      # Default Neo4j bikin file transaction log 256 MB dan MEMESANNYA di muka
      # (preallocate). Di host yang disknya mepet, permintaan 256 MB itu gagal,
      # muncul "unable to write transaction to log", dan DB masuk status
      # critical — semua transaksi berikutnya ditolak sampai di-restart.
      # Kejadian 4 Agu 2026: build 3 jam hilang di menit terakhir.
      # Graph kita cuma ~4 MB, jadi log sebesar itu mubazir.
      NEO4J_db_tx__log_rotation_size: "16M"
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
      NEO4J_db_tx__log_preallocate: "false"
    volumes:
      - neo4j_data:/data               # graph data lives here — survives restarts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
    # nama dipin biar ganti nama project compose nggak bikin volume baru yang
    # kosong — mesin yang sudah punya volume ini tetap kepakai datanya.
    # JANGAN tambahin `external: true`: itu bikin compose nolak bikin volume,
    # jadi gagal total di mesin yang belum punya (mis. laptop anggota tim baru).
    name: knowledge-graph-builder_neo4j_data