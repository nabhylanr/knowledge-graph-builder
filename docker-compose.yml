name: lab-brain-kg
services:
  neo4j:
    image: neo4j:2026.06-enterprise    # samakan dengan Desktop; enterprise wajib untuk block format
    container_name: lab-brain-neo4j
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "eval"    # WAJIB untuk image enterprise
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_db_tx__log_rotation_size: "16M"
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
      NEO4J_db_tx__log_preallocate: "false"
    volumes:
      - neo4j_data:/data
      - ./neo4j_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
volumes:
  neo4j_data:
    name: lab_brain_shared_neo4j_data